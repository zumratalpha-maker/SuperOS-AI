<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn — 语音视觉学习</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap');
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --pulse: rgba(88, 166, 255, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
    }
    .badge.learn { color: var(--accent); }
    .badge.exec { color: var(--success); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1px;
      background: var(--border);
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .chat-panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .msg.user { background: var(--panel); margin-left: 0; margin-right: auto; }
    .msg.assistant { background: rgba(88, 166, 255, 0.1); margin-left: auto; margin-right: 0; border: 1px solid var(--accent); }
    .msg .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .input-area {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .mic-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.2s;
    }
    .mic-btn:hover { background: rgba(88, 166, 255, 0.15); }
    .mic-btn.listening {
      background: var(--accent);
      color: var(--bg);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--pulse); } 50% { box-shadow: 0 0 0 12px transparent; } }
    .text-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .text-input:focus { outline: none; border-color: var(--accent); }
    .send-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 500;
      cursor: pointer;
    }
    .send-btn:hover { opacity: 0.9; }
    .knowledge-panel {
      background: var(--panel);
      padding: 16px;
      overflow-y: auto;
    }
    .knowledge-panel h3 {
      font-size: 0.9rem;
      margin: 0 0 12px 0;
      color: var(--muted);
    }
    .app-block {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .app-block .name { font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .app-block .feat { font-size: 0.85rem; color: var(--muted); margin: 4px 0; }
    .app-block .feat span { color: var(--text); margin-left: 6px; }
    .exec-btn {
      margin-left: 8px; padding: 2px 8px; font-size: 0.75rem;
      background: var(--accent); color: var(--bg); border: none;
      border-radius: 4px; cursor: pointer;
    }
    .exec-btn:hover { opacity: 0.9; }
    .f12-hint { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
    .live-hint { font-size: 0.8rem; color: var(--accent); min-height: 1.4em; padding: 4px 16px; }
    .status-bar { font-size: 0.8rem; color: var(--success); display: flex; align-items: center; gap: 6px; }
    .status-bar::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .api-root { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
    .vosk-toggle { font-size: 0.8rem; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .vosk-toggle input { accent-color: var(--accent); }
    .vosk-toggle { font-size: 0.75rem; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; }
    .vosk-toggle:hover { background: var(--panel); color: var(--accent); }
    .vosk-toggle.on { color: var(--success); }
  </style>
</head>
<body>
  <header>
    <h1>Learn</h1>
    <span class="badge learn" id="modeBadge">学习模式</span>
    <span class="vosk-toggle" id="voskToggle" title="离线模式：需先运行 npm run learn:prepare-vosk 下载模型">云端语音</span>
    <span class="api-root">API: <span id="apiRoot">/</span></span>
  </header>
  <main>
    <div class="chat-panel">
      <div class="messages" id="messages"></div>
      <div id="liveHint" class="live-hint"></div>
      <div class="input-area">
        <button class="mic-btn" id="micBtn" title="点击开始监听，需用户操作后浏览器才允许麦克风">🎤</button>
        <input type="text" class="text-input" id="textInput" placeholder="说话或输入，例如：这是剪映的开始创作按钮" />
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
    <aside class="knowledge-panel">
      <h3>已学知识</h3>
      <div class="f12-hint status-bar" id="statusBar">点击麦克风开始监听</div>
      <div id="knowledgeList">加载中…</div>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
  <script>
    const API = 'http://localhost:3856';
    const messages = document.getElementById('messages');
    const micBtn = document.getElementById('micBtn');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const knowledgeList = document.getElementById('knowledgeList');

    function addMsg(role, text, meta) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = (meta ? `<div class="meta">${meta}</div>` : '') + text.replace(/\n/g, '<br>');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    let zhVoice = null;
    function speak(text) {
      if (!window.speechSynthesis) return;
      const raw = String(text).replace(/<br\s*\/?>/gi, '。').replace(/<[^>]+>/g, '').replace(/\n/g, '。').trim();
      const t = raw.length > 80 ? raw.slice(0, 80) + '。' : raw;
      if (!t) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'zh-CN';
      u.rate = 1.0;
      if (zhVoice) u.voice = zhVoice;
      else {
        const voices = speechSynthesis.getVoices();
        zhVoice = voices.find(v => v.lang.startsWith('zh'));
        if (zhVoice) u.voice = zhVoice;
      }
      speechSynthesis.speak(u);
    }
    speechSynthesis.onvoiceschanged = () => { zhVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('zh')); };

    function sayAndShow(text, meta) {
      addMsg('assistant', text, meta);
      speak(text);
    }

    async function api(path, opts = {}) {
      const { timeoutMs, ...fetchOpts } = opts;
      const ctrl = timeoutMs ? new AbortController() : null;
      if (ctrl && timeoutMs) setTimeout(() => ctrl.abort(), timeoutMs);
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json', ...fetchOpts.headers },
        ...fetchOpts,
        signal: ctrl?.signal,
      });
      const text = await res.text();
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${text.slice(0, 100).replace(/\s+/g, ' ')}`);
      }
      if (!text.trim()) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error(`服务器返回异常（非 JSON），请查看 Learn UI 终端日志。响应前 60 字: ${text.slice(0, 60).replace(/\s+/g, ' ')}`);
      }
    }

    async function loadKnowledge() {
      try {
        const k = await api('/api/knowledge');
        if (!k.apps || Object.keys(k.apps).length === 0) {
          knowledgeList.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">暂无，用语音教我吧</p>';
          return;
        }
        let html = '';
        for (const [appName, app] of Object.entries(k.apps)) {
          const feats = app.features ? Object.entries(app.features) : [];
          html += `<div class="app-block">
            <div class="name">${appName}</div>
            ${feats.map(([f, v]) => `<div class="feat">${f}<span>(${v.xRel?.toFixed(2)},${v.yRel?.toFixed(2)})</span>
              <button class="exec-btn" data-app="${appName}" data-feat="${f}">执行</button></div>`).join('')}
          </div>`;
        }
        knowledgeList.innerHTML = html;
      } catch (e) {
        knowledgeList.innerHTML = '<p style="color:var(--danger)">加载失败</p>';
      }
    }

    let micHeard = false;
    const MIN_CMD_LEN = 3; // 过短视为噪音；3 可识别「看看画」等，减少漏检
    const INTERIM_FALLBACK_MS = 2500; // 云端语音长期无 final 时，用 interim 兜底
    async function handleUserInput(text) {
      const t = text.trim();
      if (!t) return;
      if (t.length < MIN_CMD_LEN) {
        if (liveHint) { liveHint.textContent = '（过短，请说完整）'; setTimeout(() => { if (liveHint) liveHint.textContent = ''; }, 2000); }
        return;
      }
      addMsg('user', t);
      textInput.value = '';
      if (!micHeard) {
        micHeard = true;
        sayAndShow('听到了', ' ✓');
      }

      const tl = t.toLowerCase();
      if (tl.includes('看') || tl.includes('描述') || tl.includes('画面') || tl.includes('看到')) {
        sayAndShow('好的，请把光标移到要描述的窗口上，三秒后截图。');
        if (liveHint) liveHint.textContent = '3…';
        speak('3'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '2…';
        speak('2'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '1…';
        speak('1'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '';
        let r = await api('/api/describe-cursor', { method: 'POST' });
        if (!r.ok) r = await api('/api/last-describe');
        if (!r.ok) r = await api('/api/describe', { method: 'POST' });
        if (r.ok) sayAndShow(`当前窗口：${r.windowTitle}\n\n${r.description}`);
        else sayAndShow(`失败：${r.error || '未知'}`);
        loadKnowledge();
        return;
      }
      const isTeach = tl.includes('这是') && t.length > 4;
      if (isTeach) {
        sayAndShow('好的，请把光标移到目标上，三秒后记录。');
        if (liveHint) liveHint.textContent = '3…';
        speak('3'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '2…';
        speak('2'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '1…';
        speak('1'); await new Promise(r=>setTimeout(r,1000));
        if (liveHint) liveHint.textContent = '';
        let fg = await api('/api/cursor-window');
        if (!fg.ok) fg = await api('/api/foreground');
        if (!fg.ok) {
          sayAndShow('无法获取。请把光标对准要记录的位置，再说一次。');
          return;
        }
        let name = t.replace(/^这是|的$/g, '').replace(/按钮|位置|功能$/g, '').trim() || '未命名';
        if ((name.includes('创作') && name.includes('开始')) || name === '创作开始') name = '开始创作';
        const appFromSpeech = t.match(/剪映|微信|wechat/i);
        const appFromWin = fg.windowTitle.match(/剪映|JianyingPro|CapCut|微信|WeChat/i);
        let app = (appFromSpeech ? appFromSpeech[0] : null) || (appFromWin ? appFromWin[0] : null) || fg.windowTitle.slice(0, 15) || '未知';
        if (/剪映.*图标|剪映图标/.test(t)) { app = '剪映'; name = '图标'; }
        if (/微信.*图标|微信图标/.test(t)) { app = '微信'; name = '图标'; }
        const r = await api('/api/teach', {
          method: 'POST',
          body: JSON.stringify({ app, feature: name, xRel: fg.xRel, yRel: fg.yRel }),
        });
        if (r.ok) {
          sayAndShow(`已记住「${app}|${name}」`);
          loadKnowledge();
        } else sayAndShow(`失败：${r.error}`);
        return;
      }
      const execMatch = t.match(/(?:执行|点|点击)\s*(.+)/);
      if (execMatch) {
        const feat = execMatch[1].replace(/\s/g, '').trim();
        if (!feat) { sayAndShow('请说清楚要执行的功能，如：执行开始创作'); return; }
        // 打开X → open_target，不走 clickByName
        const openMatch = feat.match(/^打开(.+)$/);
        if (openMatch) {
          const targetName = openMatch[1].trim();
          if (!targetName) { sayAndShow('请说清楚要打开的应用，如：打开微信'); return; }
          const r = await api('/api/open-app', { method: 'POST', body: JSON.stringify({ targetName }) });
          sayAndShow(r.ok ? `已打开 ${targetName}` : `打开失败：${r.error || '未找到应用'}`);
          return;
        }
        const k = await api('/api/knowledge');
        let app = null;
        for (const [a, ent] of Object.entries(k.apps || {})) {
          if (ent.features && ent.features[feat]) { app = a; break; }
        }
        if (!app) {
          const jianyingFeats = /^(开始创作|导出|导出视频|导入|添加素材)$/i;
          const wechatFeats = /^(输入框|输入|请输入|发送)$/i;
          if (jianyingFeats.test(feat)) app = '剪映';
          else if (wechatFeats.test(feat)) app = '微信';
        }
        if (!app) {
          sayAndShow('未找到学习记录，请先说「这是XXX」教学后再执行');
          return;
        }
        const r = await api('/api/execute', { method: 'POST', body: JSON.stringify({ app, feature: feat }) });
        sayAndShow(r.ok ? `已执行 ${app}|${feat}` : `执行失败：${r.error || '未找到学习记录'}`);
        return;
      }

      // 发微信：网页接口不稳定，改为提示使用终端（可靠）
      if (/(?:发微信|发消息|发给|发送|给[^\s，。：:]+说)/.test(t) || (tl.includes('微信') && /(?:发|说)/.test(t))) {
        const m1 = t.match(/给([^\s，。：:]+)发(?:送)?消息说\s*(.+)/);
        const m2 = t.match(/给([^\s，。：:]+)说\s*(.+)/);
        const contact = (m1?.[1] || m2?.[1] || '').trim();
        const msg = (m1?.[2] || m2?.[2] || '').trim();
        if (contact && msg) {
          sayAndShow(`请在终端执行：npx tsx scripts/verify-automation.ts wechat-send ${contact} ${msg}`);
        } else {
          sayAndShow('请说完整，如：给阿尔法发消息说我很忙。然后到终端执行：npx tsx scripts/verify-automation.ts wechat-send 阿尔法 我很忙');
        }
        return;
      }

      sayAndShow('可以说：看看画面、这是某某、执行某某、打开微信给某人发消息说内容');
    }

    sendBtn.onclick = () => handleUserInput(textInput.value);
    textInput.onkeydown = (e) => { if (e.key === 'Enter') handleUserInput(textInput.value); };

    const statusBar = document.getElementById('statusBar');
    const liveHint = document.getElementById('liveHint');
    let status = 'idle'; // idle | listening | stopped | error
    let lastProcessedAt = 0;
    const DEBOUNCE_MS = 800;
    let lastInterimText = '';
    let lastInterimAt = 0;
    let interimTimerId = null;
    let recognition = null;
    let useVosk = !!/[?&]vosk=1/.test(location.search) || sessionStorage.getItem('learn:vosk') === '1';
    let voskModel = null;
    let voskRecognizer = null;
    let voskAudioContext = null;
    let voskStream = null;
    const isDebug = /[?&]debug=1/.test(location.search);

    const voskToggle = document.getElementById('voskToggle');
    if (voskToggle) {
      voskToggle.textContent = useVosk ? '离线语音' : '云端语音';
      if (useVosk) voskToggle.classList.add('on');
      voskToggle.onclick = () => {
        useVosk = !useVosk;
        sessionStorage.setItem('learn:vosk', useVosk ? '1' : '0');
        voskToggle.textContent = useVosk ? '离线语音' : '云端语音';
        voskToggle.classList.toggle('on', useVosk);
        if (status === 'listening') { stopAnyListening(); setStatus('idle', useVosk ? '点击麦克风开始监听（离线）' : '点击麦克风开始监听'); }
        else setStatus(status, statusBar.textContent);
      };
    }

    function setStatus(s, msg, color) {
      status = s;
      statusBar.textContent = msg;
      statusBar.style.color = color || (s === 'error' ? 'var(--danger)' : 'var(--success)');
      if (isDebug) console.log('[Learn] status:', s, msg);
    }

    function stopAnyListening() {
      if (interimTimerId) { clearTimeout(interimTimerId); interimTimerId = null; }
      lastInterimText = '';
      if (recognition && status === 'listening') try { recognition.stop(); } catch (_) {}
      if (voskRecognizer) { voskRecognizer.remove(); voskRecognizer = null; }
      if (voskStream) { voskStream.getTracks().forEach(t=>t.stop()); voskStream = null; }
      if (voskAudioContext) { voskAudioContext.close(); voskAudioContext = null; }
      micBtn.classList.remove('listening');
      if (status === 'listening') setStatus('stopped', '已停止，点击麦克风继续');
      if (liveHint) liveHint.textContent = '';
    }

    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = (e) => {
        const len = e.results.length;
        if (len === 0) return;
        const last = e.results[len - 1];
        const t = (last[0] && last[0].transcript) ? String(last[0].transcript).trim() : '';
        const isFinal = last.isFinal === true;
        if (liveHint) liveHint.textContent = t ? (isFinal ? '' : '正在识别：' + t) : '';
        if (!t) return;
        if (isFinal) {
          lastInterimText = '';
          if (interimTimerId) { clearTimeout(interimTimerId); interimTimerId = null; }
          if (Date.now() - lastProcessedAt > DEBOUNCE_MS) {
            lastProcessedAt = Date.now();
            handleUserInput(t);
          }
        } else if (t.length >= MIN_CMD_LEN) {
          lastInterimText = t;
          lastInterimAt = Date.now();
          if (interimTimerId) clearTimeout(interimTimerId);
          interimTimerId = setTimeout(() => {
            interimTimerId = null;
            if (lastInterimText && Date.now() - lastProcessedAt > DEBOUNCE_MS) {
              const toSend = lastInterimText;
              lastInterimText = '';
              lastProcessedAt = Date.now();
              handleUserInput(toSend);
            }
            if (liveHint) liveHint.textContent = '';
          }, INTERIM_FALLBACK_MS);
        }
        if (isDebug) console.log('[Learn] onresult', { transcript: t, isFinal, len });
      };
      recognition.onerror = (err) => {
        if (err.error === 'no-speech') return;
        micBtn.classList.remove('listening');
        const msg = err.error === 'not-allowed' ? '麦克风被拒绝，请允许后重试' :
          err.error === 'network' ? '网络异常（Chrome 语音依赖 Google，国内可能不可用）' :
          '监听异常：' + (err.error || 'unknown');
        setStatus('error', msg);
        if (liveHint) liveHint.textContent = '';
        if (isDebug) console.error('[Learn] onerror', err);
      };
      recognition.onstart = () => {
        setStatus('listening', '正在监听，直接说话即可');
      };
      recognition.onend = () => {
        if (interimTimerId) { clearTimeout(interimTimerId); interimTimerId = null; }
        lastInterimText = '';
        micBtn.classList.remove('listening');
        if (status === 'listening') setStatus('stopped', '已停止，点击麦克风继续');
        if (liveHint) liveHint.textContent = '';
        if (isDebug) console.log('[Learn] onend');
      };
    } else {
      setStatus('error', '浏览器不支持语音识别，请用 Chrome/Edge');
    }

    async function startVoskListening() {
      if (!window.Vosk) {
        setStatus('error', 'Vosk 未加载');
        sayAndShow('离线识别库未加载，请刷新页面。');
        return;
      }
      micBtn.classList.add('listening');
      setStatus('listening', '正在加载离线模型…', 'var(--accent)');
      try {
        if (!voskModel) {
          voskModel = await window.Vosk.createModel('/models/model-cn.tar.gz');
        }
        stopAnyListening();
        voskStream = await navigator.mediaDevices.getUserMedia({
          video: false,
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1, sampleRate: 16000 }
        });
        voskAudioContext = new AudioContext({ sampleRate: 16000 });
        const source = voskAudioContext.createMediaStreamSource(voskStream);
        const processor = voskAudioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (e) => {
          if (voskRecognizer) try { voskRecognizer.acceptWaveform(e.inputBuffer); } catch (_) {}
        };
        source.connect(processor);
        processor.connect(voskAudioContext.destination);
        voskRecognizer = new voskModel.KaldiRecognizer();
        voskRecognizer.on('result', (msg) => {
          const text = (msg.result && msg.result.text) ? String(msg.result.text).trim() : '';
          if (text && Date.now() - lastProcessedAt > DEBOUNCE_MS) {
            lastProcessedAt = Date.now();
            handleUserInput(text);
          }
        });
        voskRecognizer.on('partialresult', (msg) => {
          const text = (msg.result && msg.result.partial) ? String(msg.result.partial).trim() : '';
          if (liveHint) liveHint.textContent = text ? '正在识别：' + text : '';
        });
        micBtn.classList.add('listening');
        setStatus('listening', '正在监听（离线）');
      } catch (e) {
        micBtn.classList.remove('listening');
        const msg = e.message || String(e);
        setStatus('error', '离线识别失败');
        sayAndShow('离线识别失败：' + msg + '。请确认已运行 npm run learn:prepare-vosk 下载模型，或切换到云端语音。');
      }
    }

    function startListening() {
      if (status === 'listening') return;
      if (useVosk) {
        startVoskListening();
        return;
      }
      if (!recognition) {
        setStatus('error', '浏览器不支持语音识别');
        return;
      }
      micBtn.classList.add('listening');
      setStatus('listening', '正在启动…', 'var(--accent)');
      try {
        recognition.start();
      } catch (e) {
        micBtn.classList.remove('listening');
        setStatus('idle', '点击麦克风开始监听');
        sayAndShow('请点击麦克风按钮开启监听。若语音无效，可尝试输入框打字或使用离线模式。');
      }
    }
    micBtn.onclick = () => {
      if (status === 'listening') { stopAnyListening(); return; }
      startListening();
    };

    const welcomeMsg = useVosk
      ? '已进入学习模式（离线）。请点击麦克风开始监听。若模型未下载，请先运行 npm run learn:prepare-vosk。'
      : '已进入学习模式。请点击麦克风开始监听。若语音无反应（Chrome 依赖 Google），可切换离线模式或输入框打字。';
    sayAndShow(welcomeMsg);
    loadKnowledge();
    knowledgeList.addEventListener('click', async (e) => {
      const btn = e.target.closest('.exec-btn');
      if (!btn) return;
      const app = btn.dataset.app, feat = btn.dataset.feat;
      if (!app || !feat) return;
      const r = await api('/api/execute', { method: 'POST', body: JSON.stringify({ app, feature: feat }) });
      sayAndShow(r.ok ? `已执行 ${app}|${feat}` : `执行失败：${r.error || '未找到学习记录'}`);
    });
  </script>
</body>
</html>
