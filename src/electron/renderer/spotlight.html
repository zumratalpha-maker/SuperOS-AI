<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;user-select:none}

.container{
  background:rgba(12,12,18,.96);
  backdrop-filter:blur(32px) saturate(1.6);
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  box-shadow:0 12px 64px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset;
  overflow:hidden;
  display:flex;flex-direction:column;
}

.brand-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 0;
}
.brand{
  font-size:11px;font-weight:700;letter-spacing:2px;
  background:linear-gradient(135deg,#6366f1,#60a5fa,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;
}
.mode-switch{
  display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:8px;padding:2px;
}
.mode-btn{
  padding:4px 10px;border-radius:6px;border:none;
  font-size:11px;color:rgba(255,255,255,.35);background:none;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.mode-btn.active{
  background:rgba(99,102,241,.25);color:#a5b4fc;
}
.mode-btn:hover:not(.active){color:rgba(255,255,255,.6)}

.chat-area{
  flex:1;overflow-y:auto;padding:8px 16px;
  display:flex;flex-direction:column;gap:6px;
  max-height:340px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.msg{
  max-width:88%;padding:8px 12px;border-radius:12px;
  font-size:13px;line-height:1.5;animation:fadeIn .25s ease;
  word-break:break-word;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(59,130,246,.3));
  color:#e0e7ff;border-bottom-right-radius:4px;
}
.msg.bot{
  align-self:flex-start;
  background:rgba(255,255,255,.05);
  color:#c7cad7;border-bottom-left-radius:4px;
}
.msg.bot .kind{
  font-size:9px;font-weight:700;letter-spacing:.5px;
  color:#818cf8;text-transform:uppercase;margin-bottom:2px;
}
.msg.bot .desc{color:rgba(255,255,255,.4);font-size:11px;margin-top:3px}
.msg.system{
  align-self:center;font-size:11px;color:rgba(255,255,255,.2);
  padding:4px 12px;background:none;
}

.input-row{
  display:flex;align-items:center;padding:10px 14px;gap:8px;
  border-top:1px solid rgba(255,255,255,.04);
  background:rgba(255,255,255,.02);
}
.voice-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,.04);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.voice-btn:hover{background:rgba(99,102,241,.2)}
.voice-btn.recording{
  background:rgba(239,68,68,.25);
  animation:pulse 1.2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.voice-btn svg{width:18px;height:18px;fill:rgba(255,255,255,.5)}
.voice-btn.recording svg{fill:#f87171}

#cmd{
  flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;outline:none;
  font-size:14px;color:#e4e6eb;caret-color:#818cf8;
  padding:8px 14px;font-family:inherit;
  transition:border-color .2s;
  resize:none;height:36px;max-height:80px;overflow-y:auto;
}
#cmd::placeholder{color:rgba(255,255,255,.2)}
#cmd:focus{border-color:rgba(99,102,241,.3)}

.send-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#6366f1,#3b82f6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;opacity:.7;
}
.send-btn:hover{opacity:1;transform:scale(1.05)}
.send-btn svg{width:16px;height:16px;fill:#fff}

.hint-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 16px 8px;font-size:10px;color:rgba(255,255,255,.15);
}

.typing{display:flex;gap:3px;padding:8px 12px;align-self:flex-start}
.typing span{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);
  animation:bounce .6s ease infinite alternate;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.4;transform:translateY(-4px)}}

.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;font-size:11px;
  background:rgba(52,211,153,.1);color:#34d399;
}
.status-pill.busy{background:rgba(99,102,241,.1);color:#a5b4fc}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.progress-inline{
  height:3px;background:rgba(255,255,255,.06);border-radius:2px;
  overflow:hidden;margin-top:6px;width:100%;
}
.progress-inline .fill{
  height:100%;border-radius:2px;width:0;
  background:linear-gradient(90deg,#6366f1,#60a5fa);
  transition:width .4s ease;
}
</style>
</head>
<body>
<div class="container" id="container">
  <div class="brand-bar">
    <span class="brand">SuperOS</span>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="text" onclick="setMode('text')">文字</button>
      <button class="mode-btn" data-mode="voice" onclick="setMode('voice')">语音</button>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg system">Alt+Space 唤醒 / Esc 隐藏 / Enter 发送</div>
  </div>

  <div class="input-row">
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="按住说话">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <textarea id="cmd" rows="1" placeholder="输入指令…" autocomplete="off" spellcheck="false"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="hint-bar">
    <span id="statusPill" class="status-pill"><span class="dot"></span>就绪</span>
    <span>Alt+Space</span>
  </div>
</div>

<script>
const cmd = document.getElementById('cmd');
const container = document.getElementById('container');
const chatArea = document.getElementById('chatArea');
const voiceBtn = document.getElementById('voiceBtn');
const statusPill = document.getElementById('statusPill');
let currentMode = 'text';
let isRecording = false;
let recognition = null;

function resize() {
  const h = container.offsetHeight;
  window.superos?.resizeWindow(Math.min(h + 4, 520));
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if (mode === 'voice') {
    cmd.placeholder = '点击麦克风或按住空格说话…';
  } else {
    cmd.placeholder = '输入指令…';
    stopVoice();
  }
}

function addMsg(type, content, meta) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'bot' && meta) {
    div.innerHTML = `<div class="kind">${meta.kind || ''}</div>${content}${meta.desc ? `<div class="desc">${meta.desc}</div>` : ''}`;
  } else {
    div.textContent = content;
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  resize();
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  resize();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
  resize();
}

function setStatus(text, busy) {
  statusPill.className = busy ? 'status-pill busy' : 'status-pill';
  statusPill.innerHTML = `<span class="dot"></span>${text}`;
}

async function send() {
  const text = cmd.value.trim();
  if (!text) return;
  cmd.value = '';
  cmd.style.height = '36px';
  addMsg('user', text);
  setStatus('处理中…', true);
  showTyping();

  try {
    const result = await window.superos.dispatch(text);
    hideTyping();

    if (result.ok && result.intent) {
      const kind = result.intent.kind || 'done';
      const desc = result.intent.targetName || result.intent.tool || '';
      addMsg('bot', result.message || '已执行', { kind, desc });
    } else if (result.ok) {
      addMsg('bot', result.message || '完成');
    } else {
      addMsg('bot', result.error || '无法识别指令', { kind: 'error' });
    }
    setStatus('就绪', false);
  } catch (err) {
    hideTyping();
    addMsg('bot', '执行异常: ' + (err.message || ''), { kind: 'error' });
    setStatus('就绪', false);
  }
}

function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  startVoice();
}

function startVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMsg('system', '浏览器不支持语音识别，请使用 Chrome');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    voiceBtn.classList.add('recording');
    setStatus('聆听中…', true);
    cmd.placeholder = '正在聆听…';
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    cmd.value = transcript;
    if (event.results[event.results.length - 1].isFinal) {
      stopVoice();
      if (transcript.trim()) send();
    }
  };

  recognition.onerror = (e) => {
    stopVoice();
    if (e.error !== 'no-speech') addMsg('system', '语音识别错误: ' + e.error);
  };

  recognition.onend = () => stopVoice();
  recognition.start();
}

function stopVoice() {
  if (recognition) { try { recognition.stop(); } catch {} }
  isRecording = false;
  voiceBtn.classList.remove('recording');
  setStatus('就绪', false);
  cmd.placeholder = currentMode === 'voice' ? '点击麦克风或按住空格说话…' : '输入指令…';
}

cmd.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    cmd.value = '';
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

cmd.addEventListener('input', () => {
  cmd.style.height = '36px';
  cmd.style.height = Math.min(cmd.scrollHeight, 80) + 'px';
  resize();
});

window.superos?.onFocusInput(() => {
  cmd.focus();
  cmd.select();
});

window.superos?.onProgress?.((step, pct) => {
  setStatus(`${step} (${pct}%)`, true);
});

window.addEventListener('DOMContentLoaded', resize);
</script>
</body>
</html>
