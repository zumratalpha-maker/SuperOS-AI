<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;user-select:none}

.container{
  background:rgba(8,10,16,.97);
  backdrop-filter:blur(32px) saturate(1.6);
  border:1px solid rgba(0,255,170,.08);
  border-radius:16px;
  box-shadow:0 12px 64px rgba(0,0,0,.7),0 0 1px rgba(0,255,170,.15) inset,0 0 40px rgba(0,255,170,.03);
  overflow:hidden;
  display:flex;flex-direction:column;
}

.brand-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 0;
}
.brand{
  font-size:11px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(135deg,#00ffaa,#00c8ff,#a855f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform:uppercase;
}
.layer-badge{
  font-size:9px;font-weight:600;letter-spacing:1px;
  color:rgba(0,255,170,.4);padding:2px 8px;
  border:1px solid rgba(0,255,170,.12);border-radius:4px;
  font-family:'Consolas','Courier New',monospace;
}
.mode-switch{
  display:flex;gap:2px;background:rgba(0,255,170,.04);border-radius:6px;padding:2px;
}
.mode-btn{
  padding:4px 10px;border-radius:4px;border:none;
  font-size:11px;color:rgba(255,255,255,.3);background:none;cursor:pointer;
  transition:all .2s;font-family:inherit;letter-spacing:.5px;
}
.mode-btn.active{
  background:rgba(0,255,170,.12);color:#00ffaa;
}
.mode-btn:hover:not(.active){color:rgba(255,255,255,.5)}

/* ─── War Room: DAG 状态看板 ─── */
.war-room{
  padding:6px 16px;display:none;flex-direction:column;gap:4px;
  border-bottom:1px solid rgba(0,255,170,.06);
}
.war-room.active{display:flex}
.war-room-title{
  font-size:9px;font-weight:700;letter-spacing:2px;
  color:rgba(0,255,170,.35);text-transform:uppercase;
  font-family:'Consolas','Courier New',monospace;
}
.dag-flow{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:4px 0;
}
.dag-node{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:4px;font-size:10px;
  font-family:'Consolas','Courier New',monospace;
  border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.3);background:rgba(255,255,255,.02);
  transition:all .3s;
}
.dag-node.active{
  border-color:rgba(0,200,255,.4);color:#00c8ff;
  background:rgba(0,200,255,.08);
  box-shadow:0 0 8px rgba(0,200,255,.1);
}
.dag-node.done{
  border-color:rgba(0,255,170,.3);color:#00ffaa;
  background:rgba(0,255,170,.06);
}
.dag-node.fail{
  border-color:rgba(255,80,80,.3);color:#ff5050;
  background:rgba(255,80,80,.06);
}
.dag-node .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.dag-node.active .dot{animation:blink 1s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dag-arrow{color:rgba(255,255,255,.1);font-size:10px;font-family:monospace}

.chat-area{
  flex:1;overflow-y:auto;padding:8px 16px;
  display:flex;flex-direction:column;gap:6px;
  max-height:280px;
  scrollbar-width:thin;scrollbar-color:rgba(0,255,170,.08) transparent;
}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(0,255,170,.1);border-radius:2px}

.msg{
  max-width:88%;padding:8px 12px;border-radius:8px;
  font-size:13px;line-height:1.5;animation:fadeIn .25s ease;
  word-break:break-word;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(0,200,255,.15),rgba(168,85,247,.12));
  border:1px solid rgba(0,200,255,.1);
  color:#c8e6ff;border-bottom-right-radius:2px;
}
.msg.bot{
  align-self:flex-start;
  background:rgba(0,255,170,.03);
  border:1px solid rgba(0,255,170,.06);
  color:#b0c4b8;border-bottom-left-radius:2px;
}
.msg.bot .kind{
  font-size:9px;font-weight:700;letter-spacing:1px;
  color:#00ffaa;text-transform:uppercase;margin-bottom:2px;
  font-family:'Consolas','Courier New',monospace;
}
.msg.bot .layer-tag{
  display:inline-block;font-size:8px;padding:1px 5px;border-radius:3px;
  background:rgba(0,200,255,.1);color:#00c8ff;margin-left:6px;
  font-family:'Consolas','Courier New',monospace;
}
.msg.bot .desc{color:rgba(255,255,255,.35);font-size:11px;margin-top:3px}
.msg.system{
  align-self:center;font-size:10px;color:rgba(0,255,170,.2);
  padding:4px 12px;background:none;
  font-family:'Consolas','Courier New',monospace;letter-spacing:.5px;
}

.input-row{
  display:flex;align-items:center;padding:10px 14px;gap:8px;
  border-top:1px solid rgba(0,255,170,.06);
  background:rgba(0,255,170,.01);
}
.voice-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,255,170,.1);
  background:rgba(0,255,170,.03);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.voice-btn:hover{background:rgba(0,255,170,.1);border-color:rgba(0,255,170,.2)}
.voice-btn.recording{
  background:rgba(255,80,80,.15);border-color:rgba(255,80,80,.3);
  animation:pulse 1.2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.2)}50%{box-shadow:0 0 0 8px rgba(255,80,80,0)}}
.voice-btn svg{width:18px;height:18px;fill:rgba(0,255,170,.4)}
.voice-btn.recording svg{fill:#ff5050}

#cmd{
  flex:1;background:rgba(0,255,170,.03);border:1px solid rgba(0,255,170,.08);
  border-radius:8px;outline:none;
  font-size:14px;color:#d0ffe8;caret-color:#00ffaa;
  padding:8px 14px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
  resize:none;height:36px;max-height:80px;overflow-y:auto;
}
#cmd::placeholder{color:rgba(0,255,170,.18)}
#cmd:focus{border-color:rgba(0,255,170,.25);box-shadow:0 0 12px rgba(0,255,170,.06)}

.send-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#00ffaa,#00c8ff);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;opacity:.6;
}
.send-btn:hover{opacity:1;transform:scale(1.05);box-shadow:0 0 16px rgba(0,255,170,.2)}
.send-btn svg{width:16px;height:16px;fill:#080a10}

.hint-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 16px 8px;font-size:9px;color:rgba(0,255,170,.12);
  font-family:'Consolas','Courier New',monospace;letter-spacing:.5px;
}

.typing{display:flex;gap:3px;padding:8px 12px;align-self:flex-start}
.typing span{
  width:5px;height:5px;border-radius:50%;background:rgba(0,255,170,.2);
  animation:bounce .6s ease infinite alternate;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.5;transform:translateY(-4px)}}

.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:4px;font-size:10px;
  background:rgba(0,255,170,.06);color:#00ffaa;
  border:1px solid rgba(0,255,170,.1);
  font-family:'Consolas','Courier New',monospace;
}
.status-pill.busy{
  background:rgba(0,200,255,.06);color:#00c8ff;
  border-color:rgba(0,200,255,.15);
}
.status-pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.status-pill.busy .dot{animation:blink 1s ease infinite}

.progress-inline{
  height:2px;background:rgba(0,255,170,.06);border-radius:1px;
  overflow:hidden;margin-top:6px;width:100%;
}
.progress-inline .fill{
  height:100%;border-radius:1px;width:0;
  background:linear-gradient(90deg,#00ffaa,#00c8ff);
  transition:width .4s ease;
  box-shadow:0 0 8px rgba(0,255,170,.3);
}
</style>
</head>
<body>
<div class="container" id="container">
  <div class="brand-bar">
    <span class="brand">SuperOS</span>
    <span class="layer-badge" id="layerBadge">L0·IDLE</span>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="text" onclick="setMode('text')">文字</button>
      <button class="mode-btn" data-mode="voice" onclick="setMode('voice')">语音</button>
    </div>
  </div>

  <!-- War Room: DAG 执行状态看板 -->
  <div class="war-room" id="warRoom">
    <span class="war-room-title">▸ EXECUTION DAG</span>
    <div class="dag-flow" id="dagFlow"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg system">Alt+Space 唤醒 · Esc 隐藏 · Enter 执行</div>
  </div>

  <div class="input-row">
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="按住说话">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <textarea id="cmd" rows="1" placeholder="输入指令…" autocomplete="off" spellcheck="false"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="hint-bar">
    <span id="statusPill" class="status-pill"><span class="dot"></span>就绪</span>
    <span>Alt+Space</span>
  </div>
</div>

<script>
const cmd = document.getElementById('cmd');
const container = document.getElementById('container');
const chatArea = document.getElementById('chatArea');
const voiceBtn = document.getElementById('voiceBtn');
const statusPill = document.getElementById('statusPill');
const warRoom = document.getElementById('warRoom');
const dagFlow = document.getElementById('dagFlow');
const layerBadge = document.getElementById('layerBadge');
let currentMode = 'text';
let isRecording = false;
let recognition = null;

function resize() {
  const h = container.offsetHeight;
  window.superos?.resizeWindow(Math.min(h + 4, 520));
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if (mode === 'voice') {
    cmd.placeholder = '点击麦克风或按住空格说话…';
  } else {
    cmd.placeholder = '输入指令…';
    stopVoice();
  }
}

function setLayerBadge(layer) {
  const labels = {
    'L1': 'L1·NATIVE', 'L2': 'L2·UIA', 'L3': 'L3·VISION',
    'L4': 'L4·SYSTEM', 'idle': 'L0·IDLE', 'exec': 'EXEC'
  };
  layerBadge.textContent = labels[layer] || layer;
}

/* ─── War Room DAG 面板 ─── */
function showWarRoom(steps) {
  if (!steps || steps.length === 0) {
    warRoom.classList.remove('active');
    resize();
    return;
  }
  warRoom.classList.add('active');
  dagFlow.innerHTML = '';
  steps.forEach((step, i) => {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.className = 'dag-arrow';
      arrow.textContent = '→';
      dagFlow.appendChild(arrow);
    }
    const node = document.createElement('span');
    node.className = 'dag-node';
    node.id = 'dag-' + i;
    const label = step.type === 'open_app' ? step.app :
                  step.type === 'click' ? step.name :
                  step.type === 'type' ? '输入' :
                  step.type === 'generate_and_type' ? '生成' :
                  step.type;
    node.innerHTML = '<span class="dot"></span>' + (label || step.type);
    dagFlow.appendChild(node);
  });
  resize();
}

function updateDagNode(index, state) {
  const node = document.getElementById('dag-' + index);
  if (node) {
    node.className = 'dag-node ' + state;
  }
}

function hideWarRoom() {
  warRoom.classList.remove('active');
  resize();
}

function addMsg(type, content, meta) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'bot' && meta) {
    const layerTag = meta.layer ? `<span class="layer-tag">${meta.layer}</span>` : '';
    div.innerHTML = `<div class="kind">${meta.kind || ''}${layerTag}</div>${content}${meta.desc ? `<div class="desc">${meta.desc}</div>` : ''}`;
  } else {
    div.textContent = content;
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  resize();
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  resize();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
  resize();
}

function setStatus(text, busy) {
  statusPill.className = busy ? 'status-pill busy' : 'status-pill';
  statusPill.innerHTML = `<span class="dot"></span>${text}`;
}

async function send() {
  const text = cmd.value.trim();
  if (!text) return;
  cmd.value = '';
  cmd.style.height = '36px';
  addMsg('user', text);
  setStatus('处理中…', true);
  setLayerBadge('exec');
  showTyping();

  try {
    const result = await window.superos.dispatch(text);
    hideTyping();

    if (result.ok && result.intent) {
      const kind = result.intent.kind || 'done';
      const desc = result.intent.targetName || result.intent.tool || '';
      const layer = result.intent.layer || '';
      if (result.intent.steps) showWarRoom(result.intent.steps);
      addMsg('bot', result.message || '已执行', { kind, desc, layer });
      if (layer) setLayerBadge(layer);
    } else if (result.ok) {
      addMsg('bot', result.message || '完成');
    } else {
      addMsg('bot', result.error || '无法识别指令', { kind: 'error' });
    }
    setStatus('就绪', false);
    setLayerBadge('idle');
  } catch (err) {
    hideTyping();
    addMsg('bot', '执行异常: ' + (err.message || ''), { kind: 'error' });
    setStatus('就绪', false);
    setLayerBadge('idle');
  }
}

function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  startVoice();
}

function startVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMsg('system', '浏览器不支持语音识别，请使用 Chrome');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    voiceBtn.classList.add('recording');
    setStatus('聆听中…', true);
    cmd.placeholder = '正在聆听…';
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    cmd.value = transcript;
    if (event.results[event.results.length - 1].isFinal) {
      stopVoice();
      if (transcript.trim()) send();
    }
  };

  recognition.onerror = (e) => {
    stopVoice();
    if (e.error !== 'no-speech') addMsg('system', '语音识别错误: ' + e.error);
  };

  recognition.onend = () => stopVoice();
  recognition.start();
}

function stopVoice() {
  if (recognition) { try { recognition.stop(); } catch {} }
  isRecording = false;
  voiceBtn.classList.remove('recording');
  setStatus('就绪', false);
  cmd.placeholder = currentMode === 'voice' ? '点击麦克风或按住空格说话…' : '输入指令…';
}

cmd.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    cmd.value = '';
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

cmd.addEventListener('input', () => {
  cmd.style.height = '36px';
  cmd.style.height = Math.min(cmd.scrollHeight, 80) + 'px';
  resize();
});

window.superos?.onFocusInput(() => {
  cmd.focus();
  cmd.select();
});

window.superos?.onProgress?.((step, pct) => {
  setStatus(`${step} (${pct}%)`, true);
});

/* DAG node progress from backend */
window.superos?.onDagProgress?.((index, state) => {
  updateDagNode(index, state);
});

window.addEventListener('DOMContentLoaded', resize);
</script>
</body>
</html>
